version: 2.1

jobs:
  ubuntu-rdp-setup:
    machine:
      image: ubuntu-2204:2023.10.1
    resource_class: medium
    steps:
      - checkout
      
      - run:
          name: Install xrdp and XFCE Desktop
          command: |
            # Set non-interactive mode
            export DEBIAN_FRONTEND=noninteractive
            
            sudo apt-get update
            
            # Install tanpa restart otomatis
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              -o Dpkg::Options::="--force-confdef" \
              -o Dpkg::Options::="--force-confold" \
              xrdp xfce4 xfce4-goodies
            
            echo "circleci:p@ssw0rd!" | sudo chpasswd
            sudo usermod -aG ssl-cert circleci
            echo "xfce4-session" > /home/circleci/.xsession
            sudo chmod +x /home/circleci/.xsession
            
      - run:
          name: Start XRDP Service
          command: |
            sudo systemctl start xrdp
            sleep 5
            sudo systemctl is-active xrdp && echo "✓ XRDP is running"
            sudo ss -tlnp | grep 3389 || echo "Checking port 3389..."
            
      - run:
          name: Download Playit Agent
          command: |
            wget -O playit-agent "https://github.com/playit-cloud/playit-agent/releases/download/v0.16.3-hack/playit-linux-amd64"
            chmod +x playit-agent
            
      - run:
          name: Start Playit Agent and Keep Alive
          no_output_timeout: 60m
          command: |
            echo "Starting Playit Agent..."
            ./playit-agent --secret 0a689350bfc031d0727bb6b7599b2a3cc128df5f777c432c68caeba76eb64d95 &
            PLAYIT_PID=$!
            echo "Playit Agent started with PID: $PLAYIT_PID"
            
            sleep 15
            
            if ps -p $PLAYIT_PID > /dev/null; then
               echo "✓ Playit Agent is running!"
            else
               echo "✗ Playit Agent failed to start!"
               exit 1
            fi
            
            echo "Keeping session alive..."
            for i in {1..300}; do
              echo "Alive: $((i*10))s"
              sleep 10
            done

workflows:
  ubuntu-rdp-workflow:
    jobs:
      - ubuntu-rdp-setup
